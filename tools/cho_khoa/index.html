<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Sổ sản phẩm</title>
<style>
:root{--nen:#f6f5f0;--chu:#1f1f1c;--mo:#6b6b66}
@media (prefers-color-scheme:dark){:root{--nen:#1a1a18;--chu:#ecebe5;--mo:#a3a29b}}
body{margin:0;background:var(--nen);color:var(--chu);font:16px/1.5 system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;padding:16px;box-sizing:border-box}
main{max-width:420px}
h1{font-size:22px;margin:0 0 8px}
p{color:var(--mo);margin:0}
</style>
</head>
<body>
<main>
<h1>Sổ sản phẩm đang được khoá</h1>
<p>Trang này chỉ mở cho gmail đã được cấp quyền. Liên hệ quản lý để được thêm gmail.</p>
</main>
</body>
</html>
